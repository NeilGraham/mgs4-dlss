[DLSS]
Enabled=1
Mode=DLAA
RenderRes=
InternalRes=3840x2160
Preset=11
Sharpness=0
LogEveryN=600
RecreateAfter=0
CompositeIfLoaded=renodx-dlss.addon64,renodx-dlss5.addon64
NrPreload=1              ; with RenoDX present, load nvngx_dlssnr.dll ourselves once, so RenoDX binds its NR runtime at startup rather than waiting for a settings change
NrKick=1                 ; with RenoDX present, create one WARP D3D12 device once the game runs, so ReShade raises init_device again and RenoDX attaches its NR runtime - without it NR only starts after a change in its settings tab
DebugMode=0
DebugKey=none
DebugKeyMode=9
Jitter=1
JitterSignX=1
JitterSignY=-1
MotionVectors=1

DynamicZeroMV=0
DynamicMaskProps=0
DynamicMask=0
PrePost=auto

PostDof=1
DofStep=2.0
DofRadius=1.0
DofJitterSign=1
DofMask=1
DofSubRect=1
DofStepFreeze=0
PreWarm=1

FrameGen=4
FGTargetFps=240
Reflex=1
ObjectMV=1
ObjectMVProps=0
CutPosLimit=6000
ObjectMVMaxPixels=200
ObjectMVMaxGradient=4
FGHintRescale=0
SceneLog=1
DRS=1
WindowScene=1
FrozenBackground=1
UIMask=1

TraceFreeze=0
TraceFrames=0
Probe=0
DumpShaders=0
FileTrace=0
AssetTrace=0

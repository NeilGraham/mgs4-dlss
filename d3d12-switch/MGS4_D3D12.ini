[Settings]
; 1 = force bgfx off Direct3D 11 so it falls back to Direct3D 12. 0 = do nothing (stock behaviour).
Enabled = 1
; Only D3D11CreateDevice calls whose Flags contain ALL these bits are failed. 0x1 = D3D11_CREATE_DEVICE_SINGLETHREADED (what bgfx passes).
FailFlagsMask = 1
; Safety valve: stop failing after this many calls.
MaxFails = 16

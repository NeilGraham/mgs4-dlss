; Machine-local paths for this checkout. Copy to config.ini (git-ignored) and edit.
; Every key can also be given as an environment variable of the same name, which wins
; over this file. Anything left blank / commented out is auto-detected:
;   MGS4_DIR     - the Steam library folders are searched for the game (app 2492670)
;   MGS4_OUT     - <repo>\work
;   ffmpeg/ffprobe/python - looked up on PATH
; Resolved values:  python tools\paths.py

; The game folder that holds mgs4.exe (the install root also works - "\MGS4" is appended).
;MGS4_DIR=D:\SteamLibrary\steamapps\common\METAL GEAR SOLID 4\MGS4

; Where recordings, gold clips, screenshots and analysis output go (needs a lot of space).
;MGS4_OUT=D:\mgs4-dlss5

; Tools used by the capture / analysis scripts.
;MGS4_FFMPEG=C:\Portable\ffmpeg\bin\ffmpeg.exe
;MGS4_FFPROBE=C:\Portable\ffmpeg\bin\ffprobe.exe
;MGS4_PYTHON=C:\Python314\python.exe

; Build tools (dlss-addon\build.bat); auto-detected through vswhere / the newest Windows SDK.
;MGS4_VCVARS=C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\VC\Auxiliary\Build\vcvars64.bat
;MGS4_FXC=C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\fxc.exe
